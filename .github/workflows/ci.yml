name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      astro_versions: ${{ steps.astro.outputs.versions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read configured Astro versions
        id: astro
        run: echo "versions=$(node ./scripts/print-astro-versions.mjs --format json)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned tool manifest
        run: npm ci

      - name: Run automated tests
        run: npm test

  smoke:
    needs: define-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro_version: ${{ fromJSON(needs.define-matrix.outputs.astro_versions) }}
        variant:
          - slim
          - alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        env:
          ASTRO_VERSION: ${{ matrix.astro_version }}
        run: |
          # Load the image into the Docker engine so the smoke test can execute
          # the same bake target definition that publish uses later on main.
          docker buildx bake "${{ matrix.variant }}" --load

      - name: Prepare fixture dependencies
        id: fixture
        run: |
          fixture_dir="$(mktemp -d)"
          node ./scripts/prepare-smoke-fixture.mjs --version "${{ matrix.astro_version }}" --output "$fixture_dir"
          (cd "$fixture_dir" && npm ci)
          echo "dir=$fixture_dir" >> "$GITHUB_OUTPUT"

      - name: Smoke test image
        run: ./scripts/smoke-test-image.sh "docker-astro-lint:${{ matrix.astro_version }}-${{ matrix.variant }}" "${{ steps.fixture.outputs.dir }}"
