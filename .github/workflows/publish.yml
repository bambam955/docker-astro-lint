name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      astro_versions: ${{ steps.astro.outputs.versions }}
      should_publish: ${{ steps.publish_guard.outputs.should_publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The publish guard compares the pushed HEAD against the branch tip
          # from before the push, so it needs the full history for that range.
          fetch-depth: 0

      - name: Decide whether this run should publish
        id: publish_guard
        shell: bash
        run: |
          node ./scripts/decide-publish.mjs \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${{ github.event.before }}" \
            --head "${GITHUB_SHA}" \
            --output "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read configured Astro versions
        id: astro
        run: echo "versions=$(node ./scripts/print-astro-versions.mjs --format json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro_version: ${{ fromJSON(needs.prepare.outputs.astro_versions) }}
        variant:
          - slim
          - alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local validation image
        env:
          ASTRO_VERSION: ${{ matrix.astro_version }}
        run: |
          # Load the image into the Docker engine so the smoke test can run the
          # exact artifact definition that the publish step will push.
          docker buildx bake "${{ matrix.variant }}" --load

      - name: Prepare fixture dependencies
        id: fixture
        run: |
          fixture_dir="$(mktemp -d)"
          node ./scripts/prepare-smoke-fixture.mjs --version "${{ matrix.astro_version }}" --output "$fixture_dir"
          (cd "$fixture_dir" && npm ci)
          echo "dir=$fixture_dir" >> "$GITHUB_OUTPUT"

      - name: Smoke test image
        run: ./scripts/smoke-test-image.sh "docker-astro-lint:${{ matrix.astro_version }}-${{ matrix.variant }}" "${{ steps.fixture.outputs.dir }}"

      - name: Build and push image
        env:
          ASTRO_VERSION: ${{ matrix.astro_version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docker-astro-lint
        run: |
          publish_override="$(mktemp)"
          trap 'rm -f "$publish_override"' EXIT
          node ./scripts/print-image-tags.mjs \
            --format bake \
            --image "$IMAGE_NAME" \
            --variant "${{ matrix.variant }}" \
            --version "$ASTRO_VERSION" \
            --target "${{ matrix.variant }}" > "$publish_override"
          docker buildx bake \
            -f docker-bake.hcl \
            -f "$publish_override" \
            "${{ matrix.variant }}" \
            --push

  skip-publish:
    needs: prepare
    if: needs.prepare.outputs.should_publish != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Skip publish when Astro versions and recipe inputs did not change
        run: echo "Configured Astro versions and recipe inputs did not change; skipping publish."
