name: publish

on:
  push:
    branches:
      - main
    paths:
      - "package-lock.json"
      - "package.json"
      - "fixtures/test-site/package-lock.json"
      - "fixtures/test-site/package.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: slim
            dockerfile: Dockerfile.slim
            lychee_version: 0.24.2
          - variant: alpine
            dockerfile: Dockerfile.alpine
            lychee_version: 0.24.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The publish guard compares the pinned Astro version to the previous
          # commit so versioned tags are not silently overwritten.
          fetch-depth: 2

      - name: Decide whether this run should publish
        id: publish_guard
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version="$(
            python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("package.json").read_text())["dependencies"]["astro"])'
          )"
          previous_version="$(
            git show HEAD^:package.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["dependencies"]["astro"])'
          )"

          if [[ "${current_version}" == "${previous_version}" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned tool manifest
        if: steps.publish_guard.outputs.should_publish == 'true'
        run: npm ci

      - name: Read pinned Astro version
        if: steps.publish_guard.outputs.should_publish == 'true'
        id: astro
        run: echo "version=$(node ./scripts/print-astro-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install fixture dependencies
        if: steps.publish_guard.outputs.should_publish == 'true'
        working-directory: fixtures/test-site
        run: npm ci

      - name: Set up Docker Buildx
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local validation image
        if: steps.publish_guard.outputs.should_publish == 'true'
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            --build-arg LYCHEE_VERSION="${{ matrix.lychee_version }}" \
            -t "docker-astro-lint:${{ steps.astro.outputs.version }}-${{ matrix.variant }}" \
            .

      - name: Smoke test image
        if: steps.publish_guard.outputs.should_publish == 'true'
        run: ./scripts/smoke-test-image.sh "docker-astro-lint:${{ steps.astro.outputs.version }}-${{ matrix.variant }}"

      - name: Build and push image
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            LYCHEE_VERSION=${{ matrix.lychee_version }}
          tags: ghcr.io/${{ github.repository_owner }}/docker-astro-lint:${{ steps.astro.outputs.version }}-${{ matrix.variant }}

      - name: Skip publish when Astro did not change
        if: steps.publish_guard.outputs.should_publish != 'true'
        run: echo "Pinned Astro version did not change; skipping publish."
