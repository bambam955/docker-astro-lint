name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - slim
          - alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The publish guard compares the pushed HEAD against the branch tip
          # from before the push, so it needs the full history for that range.
          fetch-depth: 0

      - name: Decide whether this run should publish
        id: publish_guard
        shell: bash
        run: |
          node ./scripts/decide-publish.mjs \
            --event "${GITHUB_EVENT_NAME}" \
            --before "${{ github.event.before }}" \
            --head "${GITHUB_SHA}" \
            --output "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned tool manifest
        if: steps.publish_guard.outputs.should_publish == 'true'
        run: npm ci

      - name: Read pinned Astro version
        if: steps.publish_guard.outputs.should_publish == 'true'
        id: astro
        run: echo "version=$(node ./scripts/print-astro-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install fixture dependencies
        if: steps.publish_guard.outputs.should_publish == 'true'
        working-directory: fixtures/test-site
        run: npm ci

      - name: Set up Docker Buildx
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local validation image
        if: steps.publish_guard.outputs.should_publish == 'true'
        env:
          ASTRO_VERSION: ${{ steps.astro.outputs.version }}
        run: |
          # Load the image into the Docker engine so the smoke test can run the
          # exact artifact definition that the publish step will push.
          docker buildx bake "${{ matrix.variant }}" --load

      - name: Smoke test image
        if: steps.publish_guard.outputs.should_publish == 'true'
        run: ./scripts/smoke-test-image.sh "docker-astro-lint:${{ steps.astro.outputs.version }}-${{ matrix.variant }}"

      - name: Build and push image
        if: steps.publish_guard.outputs.should_publish == 'true'
        env:
          ASTRO_VERSION: ${{ steps.astro.outputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docker-astro-lint
        run: |
          publish_tags="$(node ./scripts/print-image-tags.mjs \
            --format csv \
            --image "$IMAGE_NAME" \
            --variant "${{ matrix.variant }}" \
            --version "$ASTRO_VERSION")"
          docker buildx bake "${{ matrix.variant }}" \
            --push \
            --set "${{ matrix.variant }}.tags=${publish_tags}"

      - name: Skip publish when Astro and recipe inputs did not change
        if: steps.publish_guard.outputs.should_publish != 'true'
        run: echo "Pinned Astro version and recipe inputs did not change; skipping publish."
