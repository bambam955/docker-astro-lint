name: update-astro

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-astro:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Update pinned Astro version
        run: node ./scripts/update-astro-version.mjs

      - name: Detect version-set changes
        id: changes
        run: |
          if git diff --quiet -- astro-versions.json package.json package-lock.json fixtures/test-site/package.json fixtures/test-site/package-lock.json manifests; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read primary Astro version
        if: steps.changes.outputs.changed == 'true'
        id: astro
        run: echo "version=$(node ./scripts/print-astro-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Create update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-astro
          commit-message: "chore: refresh Astro support set"
          title: "chore: refresh Astro support set"
          body: |
            ## Summary

            - refresh each configured Astro minor line to its latest stable patch release
            - update the primary local default to v${{ steps.astro.outputs.version }} when it changes
            - regenerate the tracked tool and fixture manifests used by image builds and smoke tests
